<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Leaderboard</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --gold: #f59e0b;
      --silver: #9ca3af;
      --bronze: #b45309;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .leaderboard {
      display: grid;
      gap: 12px;
    }

    .student-card {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .rank {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      font-weight: bold;
      color: var(--accent);
    }

    .rank.first {
      background: #fef3c7;
      color: var(--gold);
    }

    .rank.second {
      background: #f3f4f6;
      color: var(--silver);
    }

    .rank.third {
      background: #ffedd5;
      color: var(--bronze);
    }

    .student-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .score-line {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .reward {
      font-size: 1.5rem;
      white-space: nowrap;
    }

    .error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .student-card {
        grid-template-columns: 48px 1fr;
      }

      .reward {
        grid-column: 1 / -1;
        padding-left: 60px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <h1>Class Leaderboard</h1>
      <p>Hearts update from Google Sheets.</p>
    </section>

    <section class="controls">
      <div id="status" class="status">Loading leaderboard...</div>
      <button onclick="loadLeaderboard()">Refresh</button>
    </section>

    <section id="leaderboard" class="leaderboard"></section>
  </main>

  <script>
    /*
      STEP 1
      Publish your Google Sheet as CSV.

      Your Google Sheet should have these exact headers:
      Student | Hearts

      STEP 2
      Paste your published CSV link below.
    */

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8jr7tiKDUBeJta25XXvF54mnMs6UOx84_0AEMKBtqMQ0rvsFcLtdul_f8990pySiBavrhxNkFj3K2/pub?gid=645769912&single=true&output=csv";

    const SPECIAL_SIXTH_EMOJI = "💛";
    const STAR_EMOJI = "🌟";
    const HEART_EMOJI = "❤️";

    const leaderboardEl = document.getElementById("leaderboard");
    const statusEl = document.getElementById("status");

    document.addEventListener("DOMContentLoaded", loadLeaderboard);

    async function loadLeaderboard() {
      try {
        if (!CSV_URL || CSV_URL.includes("PASTE_YOUR")) {
          showError("Add your published Google Sheets CSV link inside the CSV_URL variable.");
          return;
        }

        statusEl.textContent = "Loading leaderboard...";
        leaderboardEl.innerHTML = "";

        const response = await fetch(CSV_URL + "&cachebust=" + Date.now());

        if (!response.ok) {
          throw new Error("Could not load the Google Sheet CSV.");
        }

        const csvText = await response.text();
        const students = parseCSV(csvText)
          .map(row => ({
            name: row.Student || row.student || row.Name || row.name || "Unnamed student",
            hearts: Number(row.Hearts || row.hearts || row.Score || row.score || 0)
          }))
          .filter(student => student.name && !Number.isNaN(student.hearts))
          .sort((a, b) => b.hearts - a.hearts || a.name.localeCompare(b.name));

        renderLeaderboard(students);
        statusEl.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        showError(error.message);
      }
    }

    function renderLeaderboard(students) {
      if (students.length === 0) {
        showError("No students found. Check that your sheet has Student and Hearts columns.");
        return;
      }

      leaderboardEl.innerHTML = students.map((student, index) => {
        const rank = index + 1;
        const rankClass = rank === 1 ? "first" : rank === 2 ? "second" : rank === 3 ? "third" : "";

        return `
          <article class="student-card">
            <div class="rank ${rankClass}">${rank}</div>
            <div>
              <div class="student-name">${escapeHTML(student.name)}</div>
              <div class="score-line">${student.hearts} hearts</div>
            </div>
            <div class="reward">${makeReward(student.hearts)}</div>
          </article>
        `;
      }).join("");
    }

    function makeReward(score) {
      const safeScore = Math.max(0, Math.floor(Number(score) || 0));
      const hearts = HEART_EMOJI.repeat(Math.min(safeScore, 5));
      const sixth = safeScore >= 6 ? SPECIAL_SIXTH_EMOJI : "";
      const stars = safeScore >= 7 ? STAR_EMOJI.repeat(safeScore - 6) : "";

      return hearts + sixth + stars;
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentValue = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          currentValue += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          currentRow.push(currentValue.trim());
          currentValue = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (currentValue || currentRow.length) {
            currentRow.push(currentValue.trim());
            rows.push(currentRow);
            currentRow = [];
            currentValue = "";
          }

          if (char === "\r" && nextChar === "\n") i++;
        } else {
          currentValue += char;
        }
      }

      if (currentValue || currentRow.length) {
        currentRow.push(currentValue.trim());
        rows.push(currentRow);
      }

      const headers = rows.shift();
      if (!headers) return [];

      return rows.map(row => {
        const object = {};
        headers.forEach((header, index) => {
          object[header] = row[index] || "";
        });
        return object;
      });
    }

    function showError(message) {
      statusEl.textContent = "Error";
      leaderboardEl.innerHTML = `<div class="error">${escapeHTML(message)}</div>`;
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
