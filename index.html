<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Leaderboard</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --danger: #dc2626;
      --gold: #f59e0b;
      --silver: #9ca3af;
      --bronze: #b45309;
      --overlay: rgba(15, 23, 42, 0.55);
      --success: #059669;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status.success {
      color: var(--success);
    }

    .status.warning {
      color: var(--warning);
    }

    .status.error-text {
      color: var(--danger);
    }

    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button.danger {
      background: var(--danger);
    }

    button.success {
      background: var(--success);
    }

    .leaderboard {
      display: grid;
      gap: 12px;
    }

    .student-card {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .student-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .rank {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      font-weight: bold;
      color: var(--accent);
    }

    .rank.first {
      background: #fef3c7;
      color: var(--gold);
    }

    .rank.second {
      background: #f3f4f6;
      color: var(--silver);
    }

    .rank.third {
      background: #ffedd5;
      color: var(--bronze);
    }

    .student-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .score-line {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .reward-button {
      background: transparent;
      color: inherit;
      padding: 6px 8px;
      font-size: 1.5rem;
      white-space: nowrap;
      border-radius: 12px;
      min-width: 48px;
    }

    .reward-button:hover {
      background: #eef2ff;
      opacity: 1;
    }

    .empty-state,
    .error {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 18px;
      border-radius: 16px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.22);
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .field {
      margin-bottom: 12px;
    }

    .field.hidden {
      display: none;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      background: white;
      color: var(--text);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .controls {
        align-items: flex-start;
      }

      .student-card {
        grid-template-columns: 48px 1fr;
      }

      .reward-button {
        grid-column: 1 / -1;
        justify-self: start;
        margin-left: 56px;
      }

      .quick-actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <h1>Class Leaderboard</h1>
      <p>Click a student’s reward emojis to update their hearts.</p>
    </section>

    <section class="controls">
      <div id="status" class="status">Loading leaderboard...</div>
      <div class="button-row">
        <button class="success" onclick="openAddStudent()">Add student</button>
        <button onclick="loadLeaderboard()">Refresh</button>
      </div>
    </section>

    <section id="leaderboard" class="leaderboard"></section>
  </main>

  <section id="editorOverlay" class="modal-overlay" onclick="closeEditorFromOverlay(event)">
    <form id="editorForm" class="modal">
      <h2 id="editorTitle">Update student</h2>
      <p id="editorSubtitle">Set the new heart total.</p>

      <div id="studentNameField" class="field hidden">
        <label for="studentNameInput">Student name</label>
        <input id="studentNameInput" type="text" autocomplete="off" />
      </div>

      <div class="quick-actions">
        <button type="button" class="secondary" onclick="changeEditorHearts(-1)">-1</button>
        <button type="button" class="secondary" onclick="changeEditorHearts(1)">+1</button>
        <button type="button" class="secondary" onclick="changeEditorHearts(2)">+2</button>
        <button type="button" class="danger" onclick="setEditorHearts(0)">Reset</button>
      </div>

      <div class="field">
        <label for="heartTotal">Heart total</label>
        <input id="heartTotal" type="number" min="0" step="1" required />
      </div>

      <div class="field">
        <label for="teacherPin">Teacher PIN</label>
        <input id="teacherPin" type="password" autocomplete="current-password" required />
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeEditor()">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </section>

  <script>
    /*
      SETUP
      1. Deploy the Google Apps Script backend as a Web App.
      2. Paste the Web App URL below.
      3. In Apps Script, paste your Google Sheet URL into SHEET_URL.
      4. Your Google Sheet should have these headers:
         Student | Hearts
    */

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgwa2stoM4DcqriI6qMS1X5p8HibPy2QGaNPupH6GUW0YHEfFcXzr65GFRhEulhpDx/exec";

    const SPECIAL_SIXTH_EMOJI = "💛";
    const STAR_EMOJI = "🌟";
    const HEART_EMOJI = "❤️";

    const leaderboardEl = document.getElementById("leaderboard");
    const statusEl = document.getElementById("status");
    const editorOverlay = document.getElementById("editorOverlay");
    const editorForm = document.getElementById("editorForm");
    const editorTitle = document.getElementById("editorTitle");
    const editorSubtitle = document.getElementById("editorSubtitle");
    const studentNameField = document.getElementById("studentNameField");
    const studentNameInput = document.getElementById("studentNameInput");
    const heartTotalInput = document.getElementById("heartTotal");
    const teacherPinInput = document.getElementById("teacherPin");

    let selectedStudent = null;
    let editorMode = "update";
    let studentsCache = [];
    let saveQueue = Promise.resolve();

    document.addEventListener("DOMContentLoaded", loadLeaderboard);
    editorForm.addEventListener("submit", saveStudentUpdate);

    async function loadLeaderboard() {
      try {
        validateWebAppUrl();
        setStatus("Loading leaderboard...");
        leaderboardEl.innerHTML = "";

        const data = await appsScriptRequest({ action: "list" });

        if (!data.success) {
          throw new Error(data.message || "Could not load leaderboard data.");
        }

        studentsCache = data.students
          .map(student => ({
            name: String(student.name || "Unnamed student").trim(),
            hearts: Number(student.hearts || 0),
            pending: false
          }))
          .filter(student => student.name && !Number.isNaN(student.hearts));

        sortStudents();
        renderLeaderboard(studentsCache);
        setStatus(`Updated: ${new Date().toLocaleTimeString()}`, "success");
      } catch (error) {
        showError(error.message);
      }
    }

    function renderLeaderboard(students) {
      if (students.length === 0) {
        leaderboardEl.innerHTML = `<div class="empty-state">No students yet. Use Add student to start the leaderboard.</div>`;
        return;
      }

      leaderboardEl.innerHTML = students.map((student, index) => {
        const rank = index + 1;
        const rankClass = rank === 1 ? "first" : rank === 2 ? "second" : rank === 3 ? "third" : "";
        const safeName = escapeHTML(student.name);
        const pendingText = student.pending ? "Saving..." : `${student.hearts} hearts`;

        return `
          <article class="student-card">
            <div class="rank ${rankClass}">${rank}</div>
            <div>
              <div class="student-name">${safeName}</div>
              <div class="score-line">${escapeHTML(pendingText)}</div>
            </div>
            <button class="reward-button" type="button" title="Update ${safeName}" onclick="openEditorByIndex(${index})">
              ${makeReward(student.hearts) || "＋"}
            </button>
          </article>
        `;
      }).join("");
    }

    function openEditorByIndex(index) {
      const student = studentsCache[index];
      if (!student) return;
      openUpdateStudent(student.name, student.hearts);
    }

    function openUpdateStudent(studentName, hearts) {
      editorMode = "update";
      selectedStudent = studentName;
      editorTitle.textContent = studentName;
      editorSubtitle.textContent = "Set the new heart total for this student.";
      studentNameField.classList.add("hidden");
      studentNameInput.removeAttribute("required");
      studentNameInput.value = studentName;
      heartTotalInput.value = Math.max(0, Math.floor(Number(hearts) || 0));
      openEditorModal(heartTotalInput);
    }

    function openAddStudent() {
      editorMode = "add";
      selectedStudent = null;
      editorTitle.textContent = "Add student";
      editorSubtitle.textContent = "Add a new student to the leaderboard.";
      studentNameField.classList.remove("hidden");
      studentNameInput.setAttribute("required", "required");
      studentNameInput.value = "";
      heartTotalInput.value = 0;
      openEditorModal(studentNameInput);
    }

    function openEditorModal(focusElement) {
      editorOverlay.classList.add("show");
      setTimeout(() => {
        focusElement.focus();
        focusElement.select();
      }, 0);
    }

    function closeEditor() {
      selectedStudent = null;
      editorOverlay.classList.remove("show");
    }

    function closeEditorFromOverlay(event) {
      if (event.target === editorOverlay) {
        closeEditor();
      }
    }

    function changeEditorHearts(change) {
      const current = Number(heartTotalInput.value) || 0;
      heartTotalInput.value = Math.max(0, current + change);
    }

    function setEditorHearts(value) {
      heartTotalInput.value = Math.max(0, Number(value) || 0);
    }

    async function saveStudentUpdate(event) {
      event.preventDefault();

      try {
        validateWebAppUrl();

        const pin = teacherPinInput.value;
        const hearts = Math.max(0, Math.floor(Number(heartTotalInput.value) || 0));
        const studentName = editorMode === "add"
          ? studentNameInput.value.trim()
          : String(selectedStudent || "").trim();

        if (!studentName) {
          throw new Error("Enter the student name.");
        }

        if (!pin) {
          throw new Error("Enter the teacher PIN.");
        }

        if (editorMode === "add" && findStudent(studentName)) {
          throw new Error("This student already exists. Click the student’s emojis to update them instead.");
        }

        const previousCache = cloneStudents(studentsCache);

        upsertLocalStudent(studentName, hearts, true);
        closeEditor();
        renderLeaderboard(studentsCache);
        setStatus("Saved on screen. Sending to Google Sheets...", "warning");

        saveQueue = saveQueue.then(() => sendStudentToSheet(studentName, hearts, pin, previousCache));
      } catch (error) {
        showSoftError(error.message);
      }
    }

    async function sendStudentToSheet(studentName, hearts, pin, previousCache) {
      try {
        const data = await appsScriptRequest({
          action: "set",
          student: studentName,
          hearts: String(hearts),
          pin: pin
        });

        if (!data.success) {
          throw new Error(data.message || "The update was rejected by Apps Script.");
        }

        markStudentSaved(studentName);
        renderLeaderboard(studentsCache);
        setStatus(`Saved to Google Sheets: ${studentName}`, "success");
      } catch (error) {
        studentsCache = previousCache;
        renderLeaderboard(studentsCache);
        showSoftError(`Not saved. ${error.message}`);
      }
    }

    function appsScriptRequest(params) {
      return new Promise((resolve, reject) => {
        const callbackName = "leaderboardCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        const url = new URL(WEB_APP_URL);

        Object.keys(params).forEach(key => {
          url.searchParams.set(key, params[key]);
        });

        url.searchParams.set("callback", callbackName);
        url.searchParams.set("cachebust", Date.now());

        const timeoutId = setTimeout(() => {
          cleanup();
          reject(new Error("Apps Script did not respond. Check the Web App URL and deployment permissions."));
        }, 10000);

        window[callbackName] = function(data) {
          clearTimeout(timeoutId);
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          clearTimeout(timeoutId);
          cleanup();
          reject(new Error("Could not connect to the Apps Script backend."));
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function upsertLocalStudent(name, hearts, pending) {
      const existing = findStudent(name);

      if (existing) {
        existing.name = name;
        existing.hearts = hearts;
        existing.pending = pending;
      } else {
        studentsCache.push({
          name,
          hearts,
          pending
        });
      }

      sortStudents();
    }

    function markStudentSaved(name) {
      const student = findStudent(name);
      if (student) student.pending = false;
    }

    function findStudent(name) {
      const target = String(name || "").trim().toLowerCase();
      return studentsCache.find(student => student.name.toLowerCase() === target);
    }

    function cloneStudents(students) {
      return students.map(student => ({
        name: student.name,
        hearts: student.hearts,
        pending: Boolean(student.pending)
      }));
    }

    function sortStudents() {
      studentsCache.sort((a, b) => b.hearts - a.hearts || a.name.localeCompare(b.name));
    }

    function makeReward(score) {
      const safeScore = Math.max(0, Math.floor(Number(score) || 0));
      const hearts = HEART_EMOJI.repeat(Math.min(safeScore, 5));
      const sixth = safeScore >= 6 ? SPECIAL_SIXTH_EMOJI : "";
      const stars = safeScore >= 7 ? STAR_EMOJI.repeat(safeScore - 6) : "";

      return hearts + sixth + stars;
    }

    function validateWebAppUrl() {
      if (!WEB_APP_URL || WEB_APP_URL.includes("PASTE_YOUR")) {
        throw new Error("Add your Apps Script Web App URL inside the WEB_APP_URL variable.");
      }
    }

    function setStatus(message, type = "") {
      statusEl.className = "status";
      if (type) statusEl.classList.add(type);
      statusEl.textContent = message;
    }

    function showError(message) {
      setStatus("Error", "error-text");
      leaderboardEl.innerHTML = `<div class="error">${escapeHTML(message)}</div>`;
    }

    function showSoftError(message) {
      setStatus(message, "error-text");
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
